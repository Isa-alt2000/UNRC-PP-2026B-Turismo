[project]
name = "turismo-data-science"
version = "0.1.0"
description = "Datos, pipeline y modelos del recomendador turístico de Michoacán"
requires-python = ">=3.15"
dependencies = [
    "joblib>=1.6.0",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
]
