[project]
name = "turismo-backend"
version = "0.1.0"
description = "API del recomendador turístico de Michoacán"
# 3.14 es la más nueva que soporta Vercel. En local se usa 3.15 porque data_science la exige.
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.162.0",
    "joblib>=1.6.0",
    "pandas>=3.1.1",
    "pydantic-settings>=2.16.2",
    "scikit-learn>=1.9.1",
    "sqlmodel>=0.0.48",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "app.main:app"

[tool.vercel.scripts]
# Arma turismo.db dentro del deploy. En Vercel la base queda de solo lectura.
build = "python vercel_build.py"

[tool.pytest]
pythonpath = ["."]
testpaths = ["tests"]
