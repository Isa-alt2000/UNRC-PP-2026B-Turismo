[project]
name = "turismo-backend"
version = "0.1.0"
description = "API del recomendador turístico de Michoacán"
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.162.0",
    "joblib>=1.6.0",
    "pandas>=3.1.1",
    "pydantic-settings>=2.16.2",
    "scikit-learn>=1.9.1",
    "sqlmodel>=0.0.48",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
